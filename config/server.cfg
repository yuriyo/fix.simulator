# ─────────────────────────────────────────────────────────────────────────────
# QuickFIX/J FIX Exchange Simulator – server configuration
# ─────────────────────────────────────────────────────────────────────────────
# Docs: https://quickfixj.org/usermanual/2.3.0/usage/configuration.html
# ─────────────────────────────────────────────────────────────────────────────

[DEFAULT]
ConnectionType=acceptor

# Listen port
SocketAcceptPort=9876

# FIX session times (00:00:00 = never expire / 24-hour session)
StartTime=00:00:00
EndTime=00:00:00

# Heartbeat interval (seconds)
HeartBtInt=30

# Sequence number store – keeps sequences across restarts for message replay
FileStorePath=store
FileLogPath=logs

# Do NOT reset sequence numbers on reconnect (enables message restore)
ResetOnLogon=N
ResetOnLogout=N
ResetOnDisconnect=N

# FIX 4.4 data dictionary (shipped inside quickfixj-messages-fix44.jar)
UseDataDictionary=Y
DataDictionary=FIX44.xml

# Validate incoming messages
ValidateUserDefinedFields=N
ValidateIncomingMessage=Y
ValidateChecksum=Y

# Allow up to 10 concurrent client connections
MaxLatency=120

# ─────────────────────────────────────────────────────────────────────────────
# Template session used by DynamicAcceptorSessionProvider.
# Any client SenderCompID is accepted; this block provides defaults.
# ─────────────────────────────────────────────────────────────────────────────
[SESSION]
BeginString=FIX.4.4
SenderCompID=EXCHANGE
TargetCompID=CLIENT
