# Release the FIX simulator when a tag named simulator-rN.M.L is pushed to main.
#
# Example: git tag simulator-r1.2.3 && git push origin simulator-r1.2.3
#
# The tag must point to a commit that is on main. Two jobs run in order:
#   1. test    checks the tag and the branch, then runs the full test suite (build.sh test).
#              The JaCoCo and Surefire reports are kept as an artifact.
#   2. release runs only when the tests pass. It builds the image without running the tests
#              again, and publishes the image tarball, the jar and a checksum file.
name: Release simulator

on:
  push:
    tags:
      - 'simulator-r*'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag name
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^simulator-r([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$tag' does not match simulator-rN.M.L" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch origin main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not on main; no release." >&2
            exit 1
          fi

      - name: Run the tests
        run: ./build.sh test

      - name: Keep the test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-test-reports
          path: |
            target/site/jacoco/
            target/surefire-reports/
          if-no-files-found: ignore

  release:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check the tag name
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^simulator-r([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Tag '$tag' does not match simulator-rN.M.L" >&2
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4

      - name: Build the image (tests already ran in the test job)
        run: SKIP_TESTS=true ./build.sh build --version "${{ steps.version.outputs.version }}"

      - name: Package the image and the jar
        run: |
          v="${{ steps.version.outputs.version }}"
          mkdir -p dist
          docker save "fix-simulator:${v}" | gzip > "dist/fix-simulator-${v}.image.tar.gz"
          cid=$(docker create "fix-simulator:${v}")
          docker cp "${cid}:/app/fix-simulator.jar" "dist/fix-simulator-${v}.jar"
          docker rm "$cid" >/dev/null
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "FIX simulator ${{ steps.version.outputs.version }}" \
            --generate-notes \
            --verify-tag
